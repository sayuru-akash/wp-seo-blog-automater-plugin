name: Version Build

on:
  push:
    branches:
      - main
    paths:
      - 'wp-seo-blog-automater.php'
      - 'build.sh'
      - 'build.bat'
      - 'scripts/**'
      - '.github/workflows/version-build.yml'
  workflow_dispatch:
    inputs:
      force_release:
        description: Create or update the GitHub release for the current plugin version
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: version-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-version-change:
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.version.outputs.current_version }}
      version_changed: ${{ steps.diff.outputs.version_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Resolve current plugin version
        id: version
        run: echo "current_version=$(php scripts/get-version.php)" >> "$GITHUB_OUTPUT"

      - name: Detect version change in pushed range
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_changed=${{ inputs.force_release }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before_ref="${{ github.event.before }}"
          after_ref="${{ github.sha }}"

          set +e
          ./scripts/version-changed.sh "$before_ref" "$after_ref"
          status=$?
          set -e

          case "$status" in
            0)
              echo "version_changed=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "version_changed=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$status"
              ;;
          esac

  validate-release-build:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Run release build validation
        run: ./scripts/release-build-check.sh

      - name: Upload built plugin package
        uses: actions/upload-artifact@v4
        with:
          name: wp-seo-blog-automater-v${{ needs.detect-version-change.outputs.current_version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.detect-version-change.outputs.current_version }}"
          tag="v${version}"
          asset="dist/wp-seo-blog-automater-v${version}.zip"

          if [ ! -f "$asset" ]; then
            echo "Expected release asset not found: $asset" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Updating asset."
            gh release upload "$tag" "$asset" --clobber
          else
            echo "Creating release $tag."
            gh release create "$tag" "$asset" \
              --target "${{ github.sha }}" \
              --title "Version ${version}" \
              --generate-notes
          fi
